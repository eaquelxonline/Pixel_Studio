[package]
name = "pixcore"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pixel Studio core engine: pixels, layers, frames, history, storage, rendering and export."
publish = false

# Pixel Studio policy: zero third-party runtime crates. Only the Rust standard library.
[dependencies]

[lib]
name = "pixcore"
path = "Core.rs"
crate-type = ["cdylib", "rlib"]

# Developer tool: replays a JSON-lines command script (asset builds, golden scenes).
[[example]]
name = "run_script"
path = "Script.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwinding must stay enabled: every FFI entry point catches panics so they never cross into the JVM.
panic = "unwind"
